version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mistypay-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mistypay_production}
      POSTGRES_USER: ${DB_USER:-mistypay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password_123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHEEP", "pg_isready", "-U", "${DB_USER:-mistypay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mistypay-redis-prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_password_123}
    ports:
      - "6379:6379"
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mistypay-api-prod
    restart: always
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-mistypay}:${DB_PASSWORD:-secure_prod_password_123}@postgres:5432/${DB_NAME:-mistypay_production}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-secure_redis_password_123}
      - APP_ENV=production
      - APP_PORT=3000

  nginx:
    image: nginx:alpine
    container_name: mistypay-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api

volumes:
  pgdata_prod:
  redisdata_prod:
